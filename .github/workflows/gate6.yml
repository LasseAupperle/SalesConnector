name: "Gate 6: update visibility + one-click update"

# Manual gate (specs/04 §5): a shop running the v0.7.0 release must see the
# v0.9.0-test release as an update and one-click update to it. The plugin is
# installed from the real release zip (as creator shops do) instead of the
# repo mapping — WordPress cannot delete a bind-mounted plugin directory, so
# updating the mapped copy can never succeed. Run via workflow_dispatch.

on:
  workflow_dispatch:

jobs:
  update-check:
    name: wp-env sees and installs the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm install
      - name: Use a gate-specific wp-env config (no plugin source mapping)
        # .wp-env.override.json MERGES mappings with the base config, so the
        # bind mount would survive. Overwrite the whole config instead: the
        # plugin must come from the release zip, like on a creator shop.
        # Core and WooCommerce are pinned to the same pair as ci.yml — an update
        # gate that runs on a different WordPress is not testing the update path
        # a shop takes.
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "core": "WordPress/WordPress#7.1-branch",
            "phpVersion": "8.1",
            "plugins": [
              "https://downloads.wordpress.org/plugin/woocommerce.11.1.0.zip"
            ],
            "mappings": {
              "wp-content/lusc-tests": "./plugin/tests"
            },
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_LOG": true,
              "WP_DEBUG_DISPLAY": false
            }
          }
          JSON
      - name: Start wp-env
        run: npm run env:start
      - name: Install the v0.7.0 release zip (as a creator shop would)
        run: |
          npx wp-env run cli wp plugin install "https://github.com/LasseAupperle/SalesConnector/releases/download/v0.7.0/launchup-sales-connector.zip" --activate
          version=$(npx wp-env run cli wp plugin get launchup-sales-connector --field=version | tr -d '[:space:]')
          echo "installed version: $version"
          test "$version" = "0.7.0"
      - name: "Gate 6: update checker reports the v0.9.0-test release"
        run: npx wp-env run cli wp eval-file wp-content/lusc-tests/cli/phase6-update-check.php
      - name: "Gate 6: one-click update succeeds"
        run: |
          npx wp-env run cli wp plugin update launchup-sales-connector
          version=$(npx wp-env run cli wp plugin get launchup-sales-connector --field=version | tr -d '[:space:]')
          echo "version after update: $version"
          if [ "$version" != "0.9.0" ]; then
            echo "FAIL: expected 0.9.0 after update, got $version"
            exit 1
          fi
          npx wp-env run cli wp plugin is-active launchup-sales-connector
      - name: Stop wp-env
        if: always()
        run: npm run env:stop
