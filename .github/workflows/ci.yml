name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    name: PHPCS + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=plugin
      - name: PHPCS (WordPress Coding Standards)
        run: composer lint --working-dir=plugin
      - name: PHPUnit (unit suite)
        run: composer test --working-dir=plugin

  wp-env:
    name: wp-env integration (WP 7.1, WooCommerce 11.1, PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm install
      # BOTH core and WooCommerce are PINNED in .wp-env.json — never one, never latest-stable.
      #
      # Core was once pinned to a branch while WooCommerce floated. When WooCommerce 11 raised its
      # floor to WordPress 7.0 it simply stopped activating, and this job went red on every commit,
      # including ones that changed no PHP. The fix then was to pin WooCommerce back to 10.9.4;
      # the fix now is to move the baseline forward instead (DECISIONS 2026-09-11), so the pair
      # under test is the pair a creator shop actually installs: WP 7.1 + WooCommerce 11.1.0.
      #
      # Bumping either pin is a deliberate act with a gate run behind it, not a default. The note
      # lives here because wp-env validates .wp-env.json strictly and rejects any key it does not
      # know.
      - name: Start wp-env
        run: npm run env:start
      - name: Activate plugin
        run: |
          npx wp-env run cli wp plugin activate launchup-sales-connector
          npx wp-env run cli wp plugin list
      - name: Enable HPOS (custom order tables)
        run: npx wp-env run cli wp option update woocommerce_custom_orders_table_enabled yes
      - name: "Gate 0: plugin active + HPOS compatible (with WooCommerce)"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase0-check.php
      - name: "Gate 2: seed fixture shop"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/seed-fixture.php
      - name: "Gate 2: OrderSource DTO dump matches wp-env-expected.json"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase2-check.php
      - name: "Gate 2: memory sanity on 1k synthetic orders"
        run: |
          npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase2-memory-seed.php
          npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase2-memory-check.php
      - name: "Gate 9: catalogue sends published products only, variations rolled up"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase9-check.php
      - name: "Gate 3: PushClient + StatusStore against mock ingest"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase3-check.php
      - name: "Gate 4: scheduler, retry ladder, backfill (real Action Scheduler)"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase4-check.php
      - name: "Gate 5: settings save/validate, AJAX wiring, nl_NL, footprint"
        run: npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase5-check.php
      - name: "Gate 4+5: deactivation unschedules, uninstall removes all traces"
        run: |
          npx wp-env run cli wp plugin deactivate launchup-sales-connector
          npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase4-deactivation-check.php
          npx wp-env run cli wp plugin uninstall launchup-sales-connector --skip-delete
          npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/phase5-uninstall-check.php
          npx wp-env run cli wp plugin activate launchup-sales-connector
      - name: "Gate 0: no PHP errors from the plugin in debug.log"
        run: npx wp-env run cli wp eval "\$log = '/var/www/html/wp-content/debug.log'; if (file_exists(\$log) && strpos(file_get_contents(\$log), 'launchup-sales-connector') !== false) { echo file_get_contents(\$log); exit(1); } echo 'debug.log clean for the plugin';"
      - name: "Gate 0: deactivating WooCommerce shows guard notice, no fatal"
        run: |
          npx wp-env run cli wp plugin deactivate --all --exclude=launchup-sales-connector
          npx wp-env run cli wp eval-file wp-content/plugins/launchup-sales-connector/tests/cli/guard-check.php
      - name: Stop wp-env
        if: always()
        run: npm run env:stop
